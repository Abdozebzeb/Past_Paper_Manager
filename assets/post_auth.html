<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <style>
        :root {
            --bg-color: #0A0F1C;
            --card-bg: #161D2D;
            --accent-color: #448AFF;
            --text-primary: #FFFFFF;
            --text-secondary: #9BA3AF;
            --border-color: rgba(68, 138, 255, 0.2);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .message-container {
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px 60px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
            max-width: 400px;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: rgba(68, 138, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            color: var(--accent-color);
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 10px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.5;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(68, 138, 255, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(68, 138, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(68, 138, 255, 0); }
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .message-container {
                margin: 20px;
                padding: 30px 40px;
            }
        }
    </style>
</head>
<body>
<div class="message-container">
    <div class="icon-circle">✓</div>
    <h1>Authentication complete!</h1>
    <p>You may close this tab now.</p>
</div>
</body>
</html>
