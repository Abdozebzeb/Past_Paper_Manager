name: cie_desktop_app
description: "An Easy To use Past Paper App for Students"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.4

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  path: ^1.9.0
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  google_sign_in: ^6.1.6
  cloud_firestore: ^5.0.2
  url_launcher: ^6.2.2
  font_awesome_flutter: ^10.8.0
  syncfusion_flutter_pdfviewer: ^31.1.22
  file_picker: ^6.1.1
  google_sign_in_all_platforms: ^1.0.1
  flutter_markdown: ^0.7.3+1
  sqflite_common_ffi: ^2.4.2
  sqlite3_flutter_libs: ^0.6.0+eol
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  msix: ^3.16.13
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true

dependency_overrides:
  font_awesome_flutter: ^11.0.0


msix_config:
  display_name: CIE Past Paper Manager
  publisher_display_name: Abdullah Zeb
  identity_name: AbdullahZeb.CIEPastPaperManager
  publisher: "CN=E57DC75B-438E-40E2-8082-A9CF6DA669F2"
  msix_version: 2.0.0.0
  logo_path: assets/msix_icon.png
  capabilities: internetClient
  build_windows: false
  store: true